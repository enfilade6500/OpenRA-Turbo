Container@TURBO_PANEL:
	Logic: TurboSettingsLogic
	Width: PARENT_WIDTH
	Height: PARENT_HEIGHT
	Children:
		ScrollPanel@SETTINGS_SCROLLPANEL:
			Width: PARENT_WIDTH
			Height: PARENT_HEIGHT
			CollapseHiddenChildren: True
			TopBottomSpacing: 5
			ItemSpacing: 10
			Children:
				Background@TURBO_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@TURBO_TITLE:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@TURBO_DESC_CONTAINER:
							X: 10
							Width: PARENT_WIDTH - 20
							Children:
								Label@TURBO_DESC_A:
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-desc-a
								Label@TURBO_DESC_B:
									Y: 15
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-desc-b
								Label@TURBO_DESC_C:
									Y: 30
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-desc-c
				Background@FRAMES_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: label-turbo-frames-section
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@MIN_FRAMERATE_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@MIN_FRAMERATE_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
								Slider@MIN_FRAMERATE_SLIDER:
									X: 20
									Y: 25
									Width: PARENT_WIDTH - 20
									Height: 20
									Ticks: 5
									MinimumValue: 5
									MaximumValue: 25
						Container@MIN_FRAMERATE_DESC_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@MIN_FRAMERATE_DESC_A:
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-min-framerate-desc-a
								Label@MIN_FRAMERATE_DESC_B:
									Y: 15
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-min-framerate-desc-b
								Label@MIN_FRAMERATE_DESC_C:
									Y: 30
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-min-framerate-desc-c
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@FORCE_FRAMERATE_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@FORCE_FRAMERATE_LABEL:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
								Slider@FORCE_FRAMERATE_SLIDER:
									X: 20
									Y: 25
									Width: PARENT_WIDTH - 20
									Height: 20
									Ticks: 7
									MinimumValue: 0
									MaximumValue: 30
						Container@FORCE_FRAMERATE_DESC_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@FORCE_FRAMERATE_DESC_A:
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-force-framerate-desc-a
								Label@FORCE_FRAMERATE_DESC_B:
									Y: 15
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-force-framerate-desc-b
				Background@BARS_SECTION_HEADER:
					X: 5
					Width: PARENT_WIDTH - 24 - 10
					Height: 13
					Background: separator
					ClickThrough: True
					Children:
						Label@LABEL:
							Width: PARENT_WIDTH
							Height: PARENT_HEIGHT
							Font: TinyBold
							Align: Center
							Text: label-turbo-bars-section
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 50
					Children:
						Container@STATUS_BAR_DROPDOWN_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@STATUS_BARS:
									Width: PARENT_WIDTH
									Height: 20
									Text: label-turbo-status-bars
								DropDownButton@STATUS_BAR_DROPDOWN:
									Y: 25
									Width: PARENT_WIDTH
									Height: 25
									Font: Regular
						Container@STATUS_BAR_DESC_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Label@STATUS_BAR_DESC_A:
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-status-bars-desc-a
								Label@STATUS_BAR_DESC_B:
									Y: 15
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-status-bars-desc-b
								Label@STATUS_BAR_DESC_C:
									Y: 30
									Width: PARENT_WIDTH
									Height: 20
									Font: Tiny
									Text: label-turbo-status-bars-desc-c
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@SELECTED_BAR_DAMAGED_CHECKBOX_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@SELECTED_BAR_DAMAGED_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: checkbox-turbo-selected-bar-damaged
						Container@DRAG_BOX_BARS_CHECKBOX_CONTAINER:
							X: PARENT_WIDTH / 2 + 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@DRAG_BOX_BARS_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: checkbox-turbo-drag-box-bars
				Container@ROW:
					Width: PARENT_WIDTH - 24
					Height: 20
					Children:
						Container@NO_INFANTRY_BARS_CHECKBOX_CONTAINER:
							X: 10
							Width: PARENT_WIDTH / 2 - 20
							Children:
								Checkbox@NO_INFANTRY_BARS_CHECKBOX:
									Width: PARENT_WIDTH
									Height: 20
									Font: Regular
									Text: checkbox-turbo-no-infantry-bars
